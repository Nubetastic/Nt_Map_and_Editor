<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nt iMap Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app" aria-hidden="true">
    <section id="panel" class="nt-panel" aria-labelledby="panel-title">
      <nav class="list-controls" aria-label="List controls">
        <label class="lock-control" for="lock-list">
          <input id="lock-list" type="checkbox">
          <span>Lock list</span>
        </label>
      </nav>

      <header class="panel-header">
        <div>
          <h1 id="panel-title">Nearby IMAPs</h1>
          <p id="panel-description">Load, remove, and save map states. Use the hand to protect a row from Reset. Hold right mouse to look around.</p>
        </div>
        <div class="header-controls">
          <label class="scale-control">
            <span>Scale</span>
            <input id="scale-slider" type="range" min="0.50" max="2.00" step="0.05" value="1.00" aria-label="Scale interface">
            <output id="scale-value">100%</output>
          </label>
          <button id="reset-button" class="panel-reset" type="button">Reset</button>
          <button id="export-button" class="panel-export" type="button">Export</button>
          <button id="close-button" class="panel-close" type="button" aria-label="Close iMap editor">Close</button>
        </div>
      </header>

      <p id="export-status" class="export-status" role="status" aria-live="polite"></p>

      <section class="range-control">
        <div class="range-heading">
          <label for="range-slider">Search Range</label>
          <output id="range-value">10 m</output>
        </div>
        <input id="range-slider" type="range" min="2" max="50" step="1" value="10">
        <div class="range-limits"><span>2 m</span><span>50 m</span></div>
      </section>

      <div class="list-heading">
        <span id="result-count">0 IMAPs found</span>
        <span class="legend"><i class="default-dot"></i> Default <i class="loaded-dot"></i> Enabled <i class="unloaded-dot"></i> Disabled</span>
      </div>

      <section id="editor-list" class="imap-list" aria-live="polite"></section>
      <p id="empty-message" class="empty-message">No IMAPs are within this range.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
